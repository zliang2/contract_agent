name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: clausewitz
          POSTGRES_PASSWORD: clausewitz
          POSTGRES_DB: clausewitz
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clausewitz" --health-interval 2s --health-retries 15
    env:
      DATABASE_URL: postgresql://clausewitz:clausewitz@localhost:5432/clausewitz
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -v
