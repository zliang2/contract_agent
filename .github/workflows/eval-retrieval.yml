# Full retrieval eval on GitHub-hosted runners (manual). Ingests CUAD once, evaluates
# in 8 parallel shards against the same restored database, then merges the shard
# reports into one report (uploaded as the `retrieval-report` artifact).
name: eval-retrieval

on:
  workflow_dispatch:
    inputs:
      split:
        description: "Split to evaluate"
        type: choice
        options: [dev, test]
        default: dev

env:
  DATABASE_URL: postgresql://clausewitz:clausewitz@localhost:5432/clausewitz
  PG_IMAGE: pgvector/pgvector:pg16

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      db:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: clausewitz, POSTGRES_PASSWORD: clausewitz, POSTGRES_DB: clausewitz }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U clausewitz" --health-interval 2s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: cuad-v1-c38f490a984420b8a62600db401fafd5
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('clausewitz/config.py', 'clausewitz/retrieval/rerank.py') }}
      - name: Download CUAD and ingest
        run: |
          uv run python -m clausewitz.ingest.load_cuad --download
          uv run python -m clausewitz.ingest.load_db
      - name: Warm reranker model cache
        run: uv run python -c "from clausewitz.retrieval.rerank import get_model; get_model()"
      - name: Dump database
        run: |
          docker run --rm --network host -e PGPASSWORD=clausewitz -v "$PWD/data:/out" $PG_IMAGE \
            pg_dump -h localhost -U clausewitz -Fc -f /out/db.dump clausewitz
      - uses: actions/upload-artifact@v4
        with:
          name: ingested
          retention-days: 3
          path: |
            data/db.dump
            data/raw/CUAD_v1/CUAD_v1.json
            indexes/bm25

  eval:
    needs: ingest
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: true
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    services:
      db:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: clausewitz, POSTGRES_PASSWORD: clausewitz, POSTGRES_DB: clausewitz }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U clausewitz" --health-interval 2s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('clausewitz/config.py', 'clausewitz/retrieval/rerank.py') }}
      - uses: actions/download-artifact@v4
        with:
          name: ingested
      - name: Restore database
        run: |
          docker run --rm --network host -e PGPASSWORD=clausewitz -v "$PWD/data:/in" $PG_IMAGE \
            pg_restore -h localhost -U clausewitz -d clausewitz --no-owner /in/db.dump
      - name: Evaluate shard
        run: |
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
          uv run python -m evals.run_eval --split ${{ inputs.split }} --stage retrieval \
            --shard ${{ matrix.shard }}/8
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          retention-days: 7
          path: evals/reports/*_shard*.json

  merge:
    needs: eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shards
          merge-multiple: true
      - run: uv run python -m evals.merge_reports shards/*.json
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-report
          retention-days: 90
          path: evals/reports/*_merged8.json
